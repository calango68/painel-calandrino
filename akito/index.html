<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Primeiro Horizonte de Akito</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .content-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .content-card h2 {
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
      color: var(--accent-color);
    }

    audio {
      width: 100%;
      margin-top: 0.5rem;
      border-radius: 6px;
    }

    .pdf-frame {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 6px;
      margin-top: 1rem;
    }

    .btn-download {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
      margin-top: 0.5rem;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>O Primeiro Horizonte de Akito</h1>
      <p class="subtitle">Por César Renato</p>
    </header>

    <main>
      <section class="content-card">
        <h2>Livro / Documento</h2>
        <a href="O Primeiro Horizonte de Akito.pdf" target="_blank" class="btn-download">Abrir / Baixar PDF</a>
        <iframe class="pdf-frame" src="O Primeiro Horizonte de Akito.pdf"></iframe>
      </section>

      <section class="content-card">
        <h2>Trilha Sonora</h2>

        <div style="margin-bottom: 1.2rem;">
          <p><strong>Eternal Wind of the Moon (Remix Instrumental)</strong></p>
          <audio controls src="Eternal Wind of the Moon instrumental completa(Remix).mp3"></audio>
        </div>

        <div style="margin-bottom: 1.2rem;">
          <p><strong>Eternal Wind of the Moon (Piano)</strong></p>
          <audio controls src="Eternal Wind of the Moonpiano.wav"></audio>
        </div>

        <div>
          <p><strong>Eternal Wind of the Moon (Remix)</strong></p>
          <audio controls src="Eternal Wind of the Moon (Remix).wav"></audio>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 O Primeiro Horizonte de Akito — Todos os direitos reservados.</p>
    </footer>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"Últimas Notícias - Breaking News" Cesar Calandrino</title>
    <style>
        body {
            background-color: #05070a;
            background-image: radial-gradient(circle at top right, #101a2d, #05070a);
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 20px; line-height: 1.6;
        }

        header {
            display: flex; align-items: center; justify-content: center;
            border-bottom: 2px solid #ff8c00; padding-bottom: 20px; margin-bottom: 30px; gap: 20px;
        }

        /* Rosto do Robô Humanizado no lugar do círculo */
        .robo-head {
            width: 120px; height: 120px; border-radius: 50%;
            border: 2px solid #00f2ff; box-shadow: 0 0 15px #00f2ff;
            object-fit: cover; background-color: #111;
        }

        h1 { margin: 0; font-size: 2rem; color: #00f2ff; text-transform: uppercase; }
        h1 span { color: #ff8c00; display: block; font-size: 1.2rem; }

        /* Estilo para o bloco Top 5 */
        .top5-container {
            max-width: 1200px; margin: 0 auto 30px auto;
            border: 1px solid #00f2ff; border-radius: 10px;
            background: rgba(0, 242, 255, 0.05); padding: 15px;
        }

        .noticia-card {
            background: rgba(255, 255, 255, 0.03); border-left: 5px solid #ff8c00;
            padding: 15px; margin-bottom: 10px; border-radius: 5px;
        }

        .btn-canal {
            display: inline-block; margin: 5px; padding: 10px 20px;
            background: #ff8c00; color: white; text-decoration: none;
            border-radius: 5px; font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <img src="robo.png" alt="Cesar Calandrino AI" class="robo-head">
    <div>
        <h1>"Últimas Notícias - Breaking News"</h1>
        <span>Cesar Calandrino</span>
    </div>
</header>

<div class="top5-container">
    <h2 style="color: #00f2ff; margin-top: 0;">🔥 TOP 5: Política & Internacional</h2>
    <div id="container-top-5">
        </div>
</div>

<main id="container-noticias">
    </main>

<section style="text-align: center; margin-top: 50px; background: rgba(0,0,0,0.5); padding: 20px;">
    <h3>📡 Canais Amigos</h3>
    <a href="https://www.youtube.com/@SouInsano" target="_blank" class="btn-canal">🔥 Sou Insano</a>
    <a href="https://www.youtube.com/@evandromaia2939" target="_blank" class="btn-canal">🎙️ Evandro Maia</a>
    <a href="https://www.youtube.com/@osafenado2026" target="_blank" class="btn-canal">⚡ Safenado Elétrico</a>
    <a href="https://www.youtube.com/@namiradodebate" target="_blank" class="btn-canal">⚖️ Na Mira do Debate</a>
    <a href="https://www.youtube.com/@calandrinocesar" target="_blank" class="btn-canal">🕹️ Nostalgia Games</a>
</section>

<script>
    async function carregarNoticias() {
        const resp = await fetch('noticias_ticker.txt?v=' + Math.random());
        const html = await resp.text();
        // Divide o conteúdo: as 5 primeiras para o bloco top, o resto para o main
        const temp = document.createElement('div');
        temp.innerHTML = html;
        const cards = Array.from(temp.querySelectorAll('.noticia-card'));
        
        document.getElementById('container-top-5').innerHTML = cards.slice(0, 5).map(c => c.outerHTML).join('');
        document.getElementById('container-noticias').innerHTML = cards.slice(5).map(c => c.outerHTML).join('');
    }
    setInterval(carregarNoticias, 300000);
    carregarNoticias();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Calandrino</title>
    <style>
        body { 
            background: #000; color: #fff; font-family: sans-serif; padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        /* Título em Vermelho de destaque */
        .header { 
            grid-column: 1 / -1; 
            text-align: center; 
            color: #ff0000; 
            font-size: 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 3px solid #ff0000;
            margin-bottom: 20px;
        }
        /* Estilo das notícias que o script vai colar */
        .noticia-item {
            background: #111;
            border: 1px solid #333;
            border-left: 5px solid #ff0000;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="header">BREAKING NEWS <br> PAINEL CALANDRINO</div>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Calandrino - Breaking News</title>
    <style>
        /* Estilo Base */
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #ff4500;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        /* GRID DE COLUNAS - O Segredo da Organização */
        #noticias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        /* CARD DE NOTÍCIA INDIVIDUAL */
        .noticia-card {
            background: #1a1a1a;
            border-left: 5px solid #ff4500;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .noticia-card:hover {
            transform: scale(1.02);
            background: #252525;
        }

        .fonte {
            font-weight: bold;
            color: #ff9800;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .manchete {
            font-size: 1rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>Breaking News - Painel Calandrino</h1>

    <div id="noticias-grid">
        </div>

    <script>
        // Função simples para adicionar notícias (exemplo para o seu sistema)
        function adicionarNoticia(fonte, texto) {
            const grid = document.getElementById('noticias-grid');
            const card = `
                <div class="noticia-card">
                    <span class="fonte">[${fonte}]</span>
                    <div class="manchete">${texto}</div>
                </div>
            `;
            grid.innerHTML += card;
        }
        
        // Exemplo de uso: adicionarNoticia('G1 Mundo', 'Exemplo de notícia organizada...');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Primeiro Horizonte de Akito</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    header { text-align: center; margin-bottom: 30px; }
    .content-card { margin-bottom: 30px; padding: 15px; border-bottom: 1px solid #eee; }
    video, iframe { width: 100%; border-radius: 6px; }
    iframe { height: 400px; border: none; }
    audio { width: 100%; margin-top: 5px; }
    .btn-download { display: inline-block; padding: 10px 15px; background-color: #0066cc; color: #fff; text-decoration: none; border-radius: 4px; margin-bottom: 15px; }
    footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>O Primeiro Horizonte de Akito</h1>
      <p class="subtitle">Por César Renato</p>
    </header>
    <main>
      <section class="content-card">
        <h2>Vídeo Musical (Com Letra)</h2>
        <video controls>
          <source src="Primeiro Horizonte de Akito.mp4" type="video/mp4">
          Seu navegador não suporta a exibição de vídeos.
        </video>
      </section>
      <section class="content-card">
        <h2>Livro / Documento</h2>
        <a href="O Primeiro Horizonte de Akito.pdf" target="_blank" class="btn-download">Abrir / Baixar PDF</a>
        <iframe class="pdf-frame" src="O Primeiro Horizonte de Akito.pdf"></iframe>
      </section>
      <section class="content-card">
        <h2>Faixas de Áudio e Bases</h2>
        <div style="margin-bottom: 1.2rem;">
          <p><strong>Eternal Wind of the Moon (Piano)</strong></p>
          <audio controls src="piano.wav"></audio>
        </div>
        <div>
          <p><strong>Eternal Wind of the Moon (Remix)</strong></p>
          <audio controls src="remix.wav"></audio>
        </div>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 O Primeiro Horizonte de Akito — Todos os direitos reservados.</p>
    </footer>
  </div>
</body>
</html>

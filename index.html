<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Calandrino - Live</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .header, .info-bar, .canais-box { grid-column: 1 / -1; }
        .header { text-align: center; color: #ff0000; border-bottom: 3px solid #ff0000; font-size: 2.5rem; font-weight: bold; text-transform: uppercase; }
        
        /* Efeito Piscar URGENTE */
        .urgente { color: #ff0000; font-weight: bold; animation: piscar 1s infinite; }
        @keyframes piscar { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        .info-bar { display: flex; justify-content: space-between; background: #111; padding: 15px; color: #ffb703; border-radius: 5px; font-size: 1.2rem; border: 1px solid #333; }
        .canais-box { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; padding: 15px; background: #080808; border-bottom: 1px solid #444; }
        .btn-atalho { background: #222; color: #00d4ff; padding: 10px 20px; text-decoration: none; border-radius: 5px; border: 1px solid #444; font-weight: bold; transition: 0.3s; cursor: pointer; }
        .btn-atalho:hover { background: #ff4500; color: #fff; }

        /* Estilo dos Cards de Notícia */
        .noticia-item { background: #1a1a1a; border-left: 5px solid #ff0000; padding: 15px; border-radius: 4px; font-size: 1rem; line-height: 1.4; border-bottom: 1px solid #333; }
        .fonte-g1 { color: #c4170c; font-weight: bold; }
        .fonte-aljazeera { color: #ffb703; font-weight: bold; }
        
        #noticias-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header"><span class="urgente">●</span> BREAKING NEWS <br> PAINEL CALANDRINO</div>
    <div class="info-bar">
        <span>NOSTALGIA GAMES | BREAKING NEWS SHOW</span>
        <span id="relogio">00:00:00</span>
    </div>
    <div class="canais-box">
        <a class="btn-atalho" href="https://www.youtube.com/@calandrinocesar" target="_blank">📺 Nostalgia Games</a>
        <a class="btn-atalho" href="https://www.youtube.com/@BreakingNewsShow" target="_blank">📰 Breaking News Show</a>
        <a class="btn-atalho" href="https://github.com/calango68/painel-calandrino" target="_blank">🔗 Canais Amigos</a>
        <span class="btn-atalho" style="color: #0cff00;">🤖 Gemini 2026</span>
    </div>
    <script>
        function atualizarRelogio() { document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR'); }
        setInterval(atualizarRelogio, 1000); atualizarRelogio();
    </script>
    <div id="noticias-grid">

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memórias Calandrino</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .content-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .content-card h2 {
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
      color: var(--accent-color);
    }

    video, audio {
      width: 100%;
      margin-top: 0.5rem;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Memórias Calandrino</h1>
      <p class="subtitle">Acervo e registros históricos da família</p>
    </header>

    <main>
      <section class="content-card">
        <h2>Vídeo do Projeto</h2>
        <video controls>
          <source src="video_final_com_audio.mp4" type="video/mp4">
          Seu navegador não suporta a exibição de vídeos.
        </video>
      </section>

      <section class="content-card">
        <h2>Minha Jornada (Remastered)</h2>
        <p>Ouça a trilha sonora:</p>
        <audio controls>
          <source src="Minha Jornada (Remastered).wav" type="audio/wav">
          Seu navegador não suporta a execução de áudio WAV.
        </audio>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Memórias Calandrino — Todos os direitos reservados.</p>
    </footer>
  </div>

</body>
</html>
